<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride All
        Require all granted
        RewriteEngine On
        # Real files (built assets) are served as-is; everything else flows
        # through Laravel (API + SPA fallback in routes/web.php).
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "\.(env|log)$">
        Require all denied
    </FilesMatch>
</VirtualHost>