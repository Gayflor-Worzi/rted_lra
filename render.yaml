# Render Blueprint — RETD Tasks Management full-stack staging.
# API (Laravel/PHP) + Web frontend (Vite/React static site).
#
# How to deploy:
#   1. Push this file to the GitHub repo.
#   2. In Render dashboard → "New +" → "Blueprint" → pick the repo.
#   3. Fill the two secret env vars it asks for (APP_KEY, DB_PASSWORD).
services:
  - type: web
    name: rted-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/meta
    envVars:
      - key: APP_NAME
        value: RETD Tasks Management
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        value: https://rted-api.onrender.com
      - key: APP_LOCALE
        value: en
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_MAINTENANCE_DRIVER
        value: file
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: warning
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        value: aws-1-eu-west-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        value: postgres.jtwibiorwtqzvsjvmlcf
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: CORS_ALLOWED_ORIGINS
        value: https://rted-web.onrender.com,http://localhost:5173
      - key: SANCTUM_STATEFUL_DOMAINS
        value: rted-api.onrender.com

  - type: web
    name: rted-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        value: https://rted-api.onrender.com/api/v1
      - key: VITE_APP_NAME
        value: RETD Tasks Management